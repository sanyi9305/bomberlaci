<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BomberLaci</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile.css">
</head>

<body>
    <div id="game-container">
        <!-- Menu Overlay -->
        <div id="menu-overlay" class="overlay">
            <div class="menu-content">
                <h1 class="game-title">Bomber Laci</h1>
                <p class="subtitle">Choose Your Difficulty</p>
                <div class="button-group">
                    <button class="difficulty-btn" data-difficulty="beginner">
                        <span class="btn-title">🟢 Beginner</span>
                        <span class="btn-desc">Slow enemies • 3 Enemies • Random movement</span>
                    </button>
                    <button class="difficulty-btn" data-difficulty="advanced">
                        <span class="btn-title">🟡 Advanced</span>
                        <span class="btn-desc">Normal speed • 5 Enemies • Random movement</span>
                    </button>
                    <button class="difficulty-btn" data-difficulty="pro">
                        <span class="btn-title">🔴 Pro</span>
                        <span class="btn-desc">Fast enemies • 8 Enemies • Smart AI tracking</span>
                    </button>
                </div>

                <!-- Audio Settings -->
                <div class="audio-settings-container">
                    <h3 class="settings-title">Audio Settings</h3>

                    <!-- BGM Control -->
                    <div class="setting-group">
                        <div class="setting-labels">
                            <label for="bgm-volume" class="setting-name">Music</label>
                            <label class="setting-mute">
                                <input type="checkbox" id="bgm-mute"> Mute
                            </label>
                        </div>
                        <div class="slider-container">
                            <input type="range" id="bgm-volume" min="0" max="1" step="0.1" value="0.5" class="slider">
                        </div>
                    </div>

                    <!-- SFX Control -->
                    <div class="setting-group">
                        <div class="setting-labels">
                            <label for="sfx-volume" class="setting-name">Sound Effects</label>
                            <label class="setting-mute">
                                <input type="checkbox" id="sfx-mute"> Mute
                            </label>
                        </div>
                        <div class="slider-container">
                            <input type="range" id="sfx-volume" min="0" max="1" step="0.1" value="1.0" class="slider">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game UI -->
        <div id="ui-layer">
            <span id="score">Score: 0</span>
            <span id="level">Level: 1</span>
            <span id="difficulty-indicator"></span>
            <span id="status">Menu</span>
        </div>
        <canvas id="gameCanvas"></canvas>

        <!-- Mobile Controls -->
        <div id="mobile-controls">
            <div class="d-pad">
                <button class="d-btn up" data-key="ArrowUp">▲</button>
                <button class="d-btn left" data-key="ArrowLeft">◀</button>
                <div class="d-center"></div>
                <button class="d-btn right" data-key="ArrowRight">▶</button>
                <button class="d-btn down" data-key="ArrowDown">▼</button>
            </div>
            <div class="action-pad">
                <button class="action-btn" data-key="Space">💣</button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden">
            <h1>GAME OVER</h1>
            <p id="final-score">Score: 0</p>
            <div class="menu-buttons">
                <button id="try-again-btn" class="menu-btn">Try Again</button>
                <button id="main-menu-btn" class="menu-btn secondary">Main Menu</button>
            </div>
        </div>

        <p class="controls">Arrow Keys to Move | SPACE to Plant Bomb | ESC for Menu</p>
    </div>
    <script type="module" src="js/main.js"></script>
</body>

</html>
